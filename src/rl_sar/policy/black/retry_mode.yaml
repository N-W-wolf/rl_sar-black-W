black:
  # Number of control cycles used to move from the current pose to the
  # retry pose. The control loop period is 5 ms in rl_sim.
  prepare_cycles: 100

  # Joint order:
  # FL_hip, FL_thigh, FL_calf,
  # FR_hip, FR_thigh, FR_calf,
  # RL_hip, RL_thigh, RL_calf,
  # RR_hip, RR_thigh, RR_calf
  retry_default_dof_pos: [0.0, 0.82, -1.5,
                         -0.0, -0.82, 1.5,
                          0.0, 0.82, -1.5,
                         -0.0, -0.82, 1.5]

  kp: [80.0, 80.0, 80.0,
       80.0, 80.0, 80.0,
       80.0, 80.0, 80.0,
       80.0, 80.0, 80.0]

  kd: [3.0, 3.0, 3.0,
       3.0, 3.0, 3.0,
       3.0, 3.0, 3.0,
       3.0, 3.0, 3.0]
