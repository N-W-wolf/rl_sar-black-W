blackW:
  # Number of control cycles used to move from the current pose to the
  # retry pose. The control loop period is 5 ms in rl_sim.
  prepare_cycles: 100

  # Joint order:
  # FL_hip, FL_thigh, FL_calf, FL_wheel,
  # FR_hip, FR_thigh, FR_calf, FR_wheel,
  # RL_hip, RL_thigh, RL_calf, RL_wheel,
  # RR_hip, RR_thigh, RR_calf, RR_wheel
  retry_default_dof_pos: [0.0, 0.8014, -1.527, 0.0,
                         -0.0, -0.8014, 1.527, 0.0,
                         -0.0, 0.8014, -1.527, 0.0,
                          0.0, -0.8014, 1.527, 0.0]

  kp: [80.0, 80.0, 80.0, 0.0,
       80.0, 80.0, 80.0, 0.0,
       80.0, 80.0, 80.0, 0.0,
       80.0, 80.0, 80.0, 0.0]

  kd: [3.0, 3.0, 3.0, 0.5,
       3.0, 3.0, 3.0, 0.5,
       3.0, 3.0, 3.0, 0.5,
       3.0, 3.0, 3.0, 0.5]
